packaging_format = 2
id = "permit-alert"
name = "Permit Alert"
description.en = "Track E-Permit expiry dates."
description.fr = "Suivi des echeances de permis E-Permit."
version = "0.3.0~ynh2"
maintainers = ["arcenal-coder"]

[upstream]
code = "https://github.com/arcenal-coder/permit-alert_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "200M"
ram.build = "0M"
ram.runtime = "128M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/permit-alert"

    [install.init_main_permission]
    type = "group"
    default = "admins"

[resources]
    [resources.sources.main]
    url = "https://github.com/arcenal-coder/permit-alert_ynh/releases/download/v0.3.0/permit-alert-0.3.0.ynh1-amd64.tar.gz"
    sha256 = "662687fcc8695d241e26f6deb7cd9389d45296a643338a28a5900bebfc7ec3ec"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports.main]
    default = 3000

    [resources.permissions.main]
    url = "/"

    [resources.permissions.confirmation]
    url = "/confirm"
    allowed = "visitors"
    show_tile = false
    auth_header = false

    [resources.apt]
    packages = ["poppler-utils", "python3-dkim", "python3-dnspython", "ldap-utils"]
