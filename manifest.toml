packaging_format = 2
id = "permit-alert"
name = "Permit Alert"
description.en = "Track E-Permit expiry dates."
description.fr = "Suivi des echeances de permis E-Permit."
version = "0.1.0~ynh1"
maintainers = ["arcenal-coder"]

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "20M"
ram.build = "0M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/permit-alert"

    [install.init_main_permission]
    type = "group"
    default = "coordinateur"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports.main]
    default = 3000

    [resources.permissions.main]
    url = "/"
