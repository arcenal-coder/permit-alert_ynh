name: Build YunoHost package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check --manifest-path app/Cargo.toml
      - run: cargo clippy --manifest-path app/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path app/Cargo.toml
      - run: scripts/build-release
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
